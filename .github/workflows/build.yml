name: Installer bauen

# Baut bei jeder Quellcode-Aenderung die Setup-Datei und legt die aktuelle
# Fassung als dist/MonkeySetup.exe zurueck ins Repo - so ist die Exe im
# Repository immer aktuell und laesst sich weitergeben.

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'build.ps1'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-installer
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Auschecken
        uses: actions/checkout@v4

      - name: .NET 8 einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Installer bauen
        shell: pwsh
        run: ./build.ps1

      - name: Aktualisierte Exe zuruecklegen
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/MonkeySetup.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "CI: Installer aktualisiert [skip ci]"
            git push
            Write-Host "Installer im Repo aktualisiert."
          } else {
            Write-Host "Installer unveraendert - nichts zu committen."
          }
