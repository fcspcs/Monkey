name: Publish release

# Veroeffentlicht eine Version: Installer aus dem gewaehlten Stand bauen,
# Release anlegen, MonkeySetup.exe daranhaengen.
#
# Zwei Wege fuehren hierher:
#   - Einen Tag wie v1.1 pushen.
#   - Diesen Ablauf von Hand starten ("Run workflow") und die Version angeben.
#     Den Tag legt dann GitHub selbst an - so laesst sich auch ohne Git vor Ort
#     veroeffentlichen.
#
# Der Downloadlink in der README zeigt auf das jeweils neueste Release
# (releases/latest/download/MonkeySetup.exe) - der Dateiname muss deshalb
# unveraendert bleiben, sonst geht der Link ins Leere.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, z. B. v1.1 - der Tag wird angelegt, falls es ihn noch nicht gibt'
        required: true
      ref:
        description: 'Stand, aus dem gebaut wird (Branch oder Commit)'
        required: false
        default: main
      notes:
        description: 'Text des Releases. Leer: Beschreibung des Tags, sonst die Liste der Aenderungen'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # Wie hereingereicht - der naechste Schritt macht daraus RELEASE_TAG.
      # Bewusst ein anderer Name: was hier steht, laesst sich spaeter nicht
      # ueberschreiben, Eintraege aus env: haben Vorrang vor GITHUB_ENV.
      VERSION_INPUT: ${{ inputs.version || github.ref_name }}
      NOTES: ${{ inputs.notes }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          # Vollstaendig, damit die Beschreibung eines vorhandenen Tags als
          # Release-Text ausgelesen werden kann.
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Work out the version
        shell: pwsh
        run: |
          # Ohne fuehrendes v getippt? Dann eines davor - die Tags heissen v1.0,
          # v1.1, und der Downloadlink haengt an dieser Schreibweise.
          $tag = $env:VERSION_INPUT.Trim()
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }

          # v1.1 -> 1.1.0: MSBuild will drei Stellen sehen.
          $parts = @($tag.TrimStart('v').Split('.'))
          while ($parts.Count -lt 3) { $parts += '0' }

          "RELEASE_TAG=$tag"                          >> $env:GITHUB_ENV
          "RELEASE_VERSION=$($parts[0..2] -join '.')" >> $env:GITHUB_ENV

          Write-Host "Publishing $tag as version $($parts[0..2] -join '.')."

      - name: Build installer
        shell: pwsh
        run: |
          node --check cloud/worker.js
          node cloud/worker.test.mjs
          dotnet test src/Monkey.Tests/Monkey.Tests.csproj -c Release --nologo
          ./build.ps1 -Version $env:RELEASE_VERSION

      # Signiert das Update-Manifest fuer die Selbstaktualisierung. Ein Release
      # ohne Schluessel waere zwar herunterladbar, aber fuer bestehende
      # Installationen unsichtbar. Deshalb fail-closed statt still auslassen.
      - name: Sign the update manifest
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if (-not (Test-Path 'assets/update-key.pem')) {
            throw 'assets/update-key.pem is missing. Run powershell -ExecutionPolicy Bypass -File tools/new-update-key.ps1 once and commit the public key.'
          }
          if (-not $env:UPDATE_SIGNING_KEY) {
            throw 'GitHub secret UPDATE_SIGNING_KEY is missing. Refusing to publish a release without automatic updates.'
          }

          $sha = (Get-FileHash dist/MonkeySetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $version = $env:RELEASE_VERSION

          # Muss byte-genau zu UpdateWorker.CheckOnceAsync passen.
          $payload = [System.Text.Encoding]::ASCII.GetBytes("MonkeyUpdate.v1`n$version`n$sha`n")

          $ecdsa = [System.Security.Cryptography.ECDsa]::Create()
          $ecdsa.ImportFromPem($env:UPDATE_SIGNING_KEY)
          $signature = [Convert]::ToBase64String($ecdsa.SignData(
            $payload,
            [System.Security.Cryptography.HashAlgorithmName]::SHA256,
            [System.Security.Cryptography.DSASignatureFormat]::Rfc3279DerSequence))

          [ordered]@{ version = $version; sha256 = $sha; signature = $signature } |
            ConvertTo-Json | Set-Content dist/update.json -Encoding ascii

          Write-Host "update.json written and signed for $version."

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $number = $tag.TrimStart('v')

          # Text des Releases: was beim Start mitgegeben wurde, sonst die
          # Beschreibung des Tags, sonst laesst GitHub die Aenderungen auflisten.
          $notes = $env:NOTES
          if (-not $notes) {
            $notes = (git tag -l --format='%(contents)' $tag | Out-String).Trim()
          }

          # Gibt es den Tag noch nicht, legt GitHub ihn auf diesen Stand an.
          $target = (git rev-parse HEAD).Trim()

          [string[]]$files = @('dist/MonkeySetup.exe')
          if (Test-Path 'dist/update.json') { $files += 'dist/update.json' }

          [string[]]$arguments = @('release', 'create', $tag) + $files + @(
            '--title', "Monkey $number",
            '--target', $target
          )
          if ($notes) { $arguments += @('--notes', $notes) }
          else        { $arguments += '--generate-notes' }

          gh @arguments
