name: Build installer

# Builds the setup file on every source change and puts the fresh
# dist/MonkeySetup.exe back into the repository, so the download link always
# points at an up-to-date installer.

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'build.ps1'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-installer
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build installer
        shell: pwsh
        run: ./build.ps1

      - name: Commit the updated installer
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/MonkeySetup.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "CI: refresh installer [skip ci]"
            git push
            Write-Host "Installer updated in the repository."
          } else {
            Write-Host "Installer unchanged - nothing to commit."
          }
